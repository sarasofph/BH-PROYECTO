<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donar - BackHome</title>

    <link rel="stylesheet"
          th:href="@{/css/cliente/donacion.css}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">BackHome</div>

        <a th:href="@{/cliente/dashboard}" class="volver">
            ← Volver al inicio
        </a>
    </nav>

    <main class="donacion-container">

        <section class="donacion-card">

            <div class="donacion-header">
                <div class="icono">💗</div>

                <h1>Haz una donación</h1>

                <p>
                    Tu aporte ayuda a BackHome a seguir apoyando
                    a mascotas y familias que lo necesitan.
                </p>
            </div>

            <!-- MENSAJE DE ÉXITO -->
            <div th:if="${success}" class="alert success">
                <span>✓</span>
                <span th:text="${success}"></span>
            </div>

            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}" class="alert error">
                <span>!</span>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/cliente/donar}"
                  method="post">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="monto">
                        ¿Cuánto deseas donar?
                    </label>

                    <div class="monto-input">
                        <span>$</span>

                        <input type="number"
                               id="monto"
                               name="monto"
                               min="1"
                               step="0.01"
                               placeholder="0.00"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mensaje">
                        Mensaje
                        <span>(opcional)</span>
                    </label>

                    <textarea id="mensaje"
                              name="mensaje"
                              maxlength="255"
                              rows="4"
                              placeholder="Escribe un mensaje para BackHome..."></textarea>
                </div>

                <button type="submit"
                        class="btn-donar">
                    💗 Realizar donación
                </button>

            </form>

            <p class="nota">
                Gracias por apoyar la misión de BackHome 🐾
            </p>

        </section>

    </main>

</body>
</html>
