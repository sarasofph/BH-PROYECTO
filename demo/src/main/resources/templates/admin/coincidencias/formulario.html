<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nueva coincidencia | BackHome</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin-crud.css}">

</head>

<body>
<div class="admin-layout">
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🐾</div>
    <div><h2>BackHome</h2><span>Panel administrativo</span></div>
  </div>
  <nav class="menu">
    <p class="menu-title">PRINCIPAL</p>
    <a th:href="@{/admin/dashboard}"><span>🏠</span> Dashboard</a>
    <p class="menu-title">ADMINISTRACIÓN</p>
    <a th:href="@{/admin/usuarios}"><span>👥</span> Usuarios</a>
    <a th:href="@{/admin/animales}"><span>🐶</span> Animales</a>
    <a th:href="@{/admin/seguimientos}"><span>🔎</span> Seguimientos</a>
    <a th:href="@{/admin/refugios}"><span>🏠</span> Refugios</a>
    <a th:href="@{/admin/donaciones}"><span>💗</span> Donaciones</a>
    <a th:href="@{/admin/soporte}"><span>💬</span> Soporte</a>
    <p class="menu-title">HERRAMIENTAS</p>
    <a th:href="@{/admin/coincidencias}"><span>🔗</span> Coincidencias</a>
    <a th:href="@{/admin/ingresos-refugio}"><span>🐾</span> Ingresos a refugio</a>
    <a th:href="@{/admin/prioridades}"><span>⭐</span> Prioridades</a>
    <a th:href="@{/admin/lugares}"><span>📍</span> Lugares</a>
    <a th:href="@{/admin/consejos}"><span>💡</span> Consejos</a>
  </nav>
  <div class="sidebar-footer"><div class="admin-info"><div class="admin-avatar">A</div><div><strong>Administrador</strong><span>Panel BackHome</span></div></div></div>
</aside>


<div class="contenedor">

<main class="contenido">

    <div class="encabezado">

        <div>
            <h2>🔗 Nueva coincidencia</h2>
        </div>

        <a th:href="@{/admin/coincidencias}"
           class="boton boton-secundario">
            Volver
        </a>

    </div>

    <form th:action="@{/admin/coincidencias/guardar}"
          th:object="${coincidencia}"
          method="post"
          class="tarjeta formulario">

        <div>

            <label>Seguimiento perdido</label>

            <select name="perdidoId"
                    required>

                <option value="">
                    Selecciona un seguimiento
                </option>

                <option th:each="seguimiento : ${seguimientos}"
                        th:value="${seguimiento.idSeguimiento}"
                        th:text="${seguimiento.titulo}">
                </option>

            </select>

        </div>

        <div>

            <label>Seguimiento encontrado</label>

            <select name="encontradoId"
                    required>

                <option value="">
                    Selecciona un seguimiento
                </option>

                <option th:each="seguimiento : ${seguimientos}"
                        th:value="${seguimiento.idSeguimiento}"
                        th:text="${seguimiento.titulo}">
                </option>

            </select>

        </div>

        <div>

            <label>Porcentaje de coincidencia</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   max="100"
                   th:field="*{porcentajeCoincidencia}">

        </div>

        <div>

            <label>Estado</label>

            <select th:field="*{estado}">

                <option value="pendiente">
                    Pendiente
                </option>

                <option value="confirmada">
                    Confirmada
                </option>

                <option value="descartada">
                    Descartada
                </option>

            </select>

        </div>

        <div class="completo">

            <label>Fecha</label>

            <input type="datetime-local"
                   th:field="*{fechaCoincidencia}">

        </div>

        <div class="completo">

            <label>Observación</label>

            <textarea th:field="*{observacion}">
            </textarea>

        </div>

        <div class="completo">

            <button type="submit">
                Guardar coincidencia
            </button>

        </div>

    </form>

</main>

</div>
</div>
</body>
</html>
