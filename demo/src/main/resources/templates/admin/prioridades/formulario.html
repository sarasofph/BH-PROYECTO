<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Prioridad | BackHome</title>

    <link rel="stylesheet"
          th:href="@{/css/admin/admin-crud.css}">

</head>

<body>
<div class="admin-layout">
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🐾</div>
    <div><h2>BackHome</h2><span>Panel administrativo</span></div>
  </div>
  <nav class="menu">
    <p class="menu-title">PRINCIPAL</p>
    <a th:href="@{/admin/dashboard}"><span>🏠</span> Dashboard</a>
    <p class="menu-title">ADMINISTRACIÓN</p>
    <a th:href="@{/admin/usuarios}"><span>👥</span> Usuarios</a>
    <a th:href="@{/admin/animales}"><span>🐶</span> Animales</a>
    <a th:href="@{/admin/seguimientos}"><span>🔎</span> Seguimientos</a>
    <a th:href="@{/admin/refugios}"><span>🏠</span> Refugios</a>
    <a th:href="@{/admin/donaciones}"><span>💗</span> Donaciones</a>
    <a th:href="@{/admin/soporte}"><span>💬</span> Soporte</a>
    <p class="menu-title">HERRAMIENTAS</p>
    <a th:href="@{/admin/coincidencias}"><span>🔗</span> Coincidencias</a>
    <a th:href="@{/admin/ingresos-refugio}"><span>🐾</span> Ingresos a refugio</a>
    <a th:href="@{/admin/prioridades}"><span>⭐</span> Prioridades</a>
    <a th:href="@{/admin/lugares}"><span>📍</span> Lugares</a>
    <a th:href="@{/admin/consejos}"><span>💡</span> Consejos</a>
  </nav>
  <div class="sidebar-footer"><div class="admin-info"><div class="admin-avatar">A</div><div><strong>Administrador</strong><span>Panel BackHome</span></div></div></div>
</aside>


<div class="contenedor">

<main class="contenido">

    <div class="encabezado">

        <h2>⭐ Prioridad</h2>

        <a th:href="@{/admin/prioridades}"
           class="boton boton-secundario">
            Volver
        </a>

    </div>

    <form th:action="@{/admin/prioridades/guardar}"
          th:object="${prioridad}"
          method="post"
          class="tarjeta formulario">

        <input type="hidden"
               th:field="*{idPrioridad}">

        <div>

            <label>Nombre</label>

            <input type="text"
                   th:field="*{nombre}"
                   required>

        </div>

        <div>

            <label>Nivel</label>

            <input type="number"
                   min="1"
                   th:field="*{nivel}"
                   required>

        </div>

        <div>

            <label>Estado</label>

            <select th:field="*{estado}">

                <option value="activo">
                    Activo
                </option>

                <option value="inactivo">
                    Inactivo
                </option>

            </select>

        </div>

        <div class="completo">

            <label>Descripción</label>

            <textarea th:field="*{descripcion}">
            </textarea>

        </div>

        <div class="completo">

            <button type="submit">
                Guardar prioridad
            </button>

        </div>

    </form>

</main>

</div>
</div>
</body>
</html>
