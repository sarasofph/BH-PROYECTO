<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${modoEdicion ? 'BackHome | Editar refugio' : 'BackHome | Nuevo refugio'}">
        BackHome | Refugio
    </title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin/admin.css}">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="brand">

            <div>
                <strong>BackHome</strong>
                <span>Panel administrativo</span>
            </div>

        </div>

        <nav class="sidebar-menu">

            <a th:href="@{/admin/dashboard}"
               class="menu-item">

                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>

            </a>

            <a th:href="@{/admin/usuarios}"
               class="menu-item">

                <i class="fa-solid fa-users"></i>
                <span>Usuarios</span>

            </a>

            <a th:href="@{/admin/seguimientos}"
               class="menu-item">

                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Seguimientos</span>

            </a>

            <a th:href="@{/admin/refugios}"
               class="menu-item active">

                <i class="fa-solid fa-house"></i>
                <span>Refugios</span>

            </a>

            <a href="#"
               class="menu-item disabled">

                <i class="fa-solid fa-hand-holding-heart"></i>
                <span>Donaciones</span>

                <small>Próximamente</small>

            </a>

            <a href="#"
               class="menu-item disabled">

                <i class="fa-solid fa-lightbulb"></i>
                <span>Consejos</span>

                <small>Próximamente</small>

            </a>

            <a href="#"
               class="menu-item disabled">

                <i class="fa-solid fa-file-pdf"></i>
                <span>Reportes</span>

                <small>Próximamente</small>

            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="welcome-small">
                    Refugios
                </p>

                <h1 th:text="${modoEdicion ? 'Editar refugio' : 'Registrar refugio'}">
                    Registrar refugio
                </h1>

                <p class="welcome-description">
                    Completa la información del refugio.
                </p>

            </div>

            <a th:href="@{/admin/refugios}"
               class="secondary-button">

                <i class="fa-solid fa-arrow-left"></i>

                Volver

            </a>

        </header>


        <section class="content-section">

            <div class="table-section">

                <div class="section-heading">

                    <div>

                        <span class="eyebrow">
                            Información
                        </span>

                        <h2>
                            Datos del refugio
                        </h2>

                    </div>

                </div>


                <form th:action="@{/admin/refugios/guardar}"
                      method="post"
                      class="form-grid">

                    <input type="hidden"
                           name="idRefugio"
                           th:value="${refugio.idRefugio}">


                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">


                    <div class="form-group">

                        <label for="nombre">
                            Nombre *
                        </label>

                        <input id="nombre"
                               name="nombre"
                               type="text"
                               maxlength="150"
                               required
                               th:value="${refugio.nombre}"
                               placeholder="Nombre del refugio">

                    </div>


                    <div class="form-group">

                        <label for="localidadId">
                            Localidad *
                        </label>

                        <select id="localidadId"
                                name="localidadId"
                                required>

                            <option value="">
                                Selecciona una localidad
                            </option>

                            <option th:each="loc : ${localidades}"
                                    th:value="${loc.idLocalidad}"
                                    th:text="${loc.nombre}"
                                    th:selected="${refugio.localidad != null and refugio.localidad.idLocalidad == loc.idLocalidad}">
                            </option>

                        </select>

                    </div>


                    <div class="form-group"
                         style="grid-column: 1 / -1;">

                        <label for="direccion">
                            Dirección *
                        </label>

                        <input id="direccion"
                               name="direccion"
                               type="text"
                               maxlength="255"
                               required
                               th:value="${refugio.direccion}"
                               placeholder="Dirección del refugio">

                    </div>


                    <div class="form-group">

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input id="telefono"
                               name="telefono"
                               type="text"
                               maxlength="20"
                               th:value="${refugio.telefono}"
                               placeholder="Teléfono">

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input id="email"
                               name="email"
                               type="email"
                               maxlength="150"
                               th:value="${refugio.email}"
                               placeholder="correo@ejemplo.com">

                    </div>


                    <div class="form-group"
                         style="grid-column: 1 / -1;">

                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea id="descripcion"
                                  name="descripcion"
                                  rows="5"
                                  placeholder="Describe el refugio, sus servicios y características..."
                                  th:text="${refugio.descripcion}"></textarea>

                    </div>


                    <div class="modal-actions"
                         style="grid-column: 1 / -1;">

                        <a th:href="@{/admin/refugios}"
                           class="secondary-button">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="primary-button">

                            <i class="fa-solid fa-floppy-disk"></i>

                            <span th:text="${modoEdicion ? 'Guardar cambios' : 'Registrar refugio'}">
                                Registrar refugio
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
